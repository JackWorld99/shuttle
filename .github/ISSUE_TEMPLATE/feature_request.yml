name: Feature request
description: Suggest an idea for Shuttle
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: When does Shuttle get in your way?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today
