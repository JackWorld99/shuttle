name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Shuttle on the phone …
        2. On the PC …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → More → Version, e.g. 2026.11.21 (2289)
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms involved
      multiple: true
      options:
        - Android
        - Windows
        - macOS
    validations:
      required: true

  - type: textarea
    id: devices
    attributes:
      label: Devices and network
      description: Phone model and Android version; same Wi-Fi or Tailscale.

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: On Windows, diagnostics are in the `logs` folder next to Shuttle (or under %LOCALAPPDATA%\Shuttle). They don't contain file contents, but please check for anything private before posting.
