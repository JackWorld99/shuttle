# Shuttle: Android release build in CI (the APK that auto-update ships).
#
# Based on LocalSend's own build_android_apk.yml, with these changes:
# - arm64 only (practically every current Android phone), no per-ABI split: versionCode is the build number
#   (with per-ABI APKs LocalSend multiplies it by 10 and adds an ABI number).
# - Version: version name = date of the latest commit, build number from support/scripts/shuttle_version.sh,
#   same as on Windows.
# - Signing key: a dedicated release key. It replaced an earlier debug key, so a Shuttle signed with the old
#   key has to be uninstalled and reinstalled once.
#   PKCS12 keystore (alias shuttle, RSA 4096). The base64 of the file is ANDROID_KEYSTORE_BASE64 in the release
#   environment, the (randomly generated) password is ANDROID_KEYSTORE_PASSWORD there. The original keystore is
#   kept offline, outside any repository.
#   After the build, the certificate SHA-256 must equal EXPECTED_CERT_SHA256 below or the job fails: an APK
#   signed with a different key cannot be installed over the existing app (Android only accepts the same key).
# - Further checks after the build: not debuggable, versionCode = build number, Rust core library included.
# - Not triggered automatically: start it manually (Actions page) or via the release workflow
#   shareme_release.yml.
# - Hardening: builds only on the main branch (it needs the signing key). The build job runs in the
#   GitHub Environment "release", which holds ANDROID_KEYSTORE_BASE64 and may only be used by main.
#   To try an APK build from another branch, build locally.
name: Shuttle Android

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: "Version name, e.g. 2026.11.16"
        value: ${{ jobs.build_apk.outputs.version }}
      build:
        description: "Build number"
        value: ${{ jobs.build_apk.outputs.build }}

concurrency:
  group: shareme-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"
  # SHA-256 of the signing certificate (public information, not the key): the "certificate SHA-256 digest"
  # printed by apksigner verify --print-certs
  EXPECTED_CERT_SHA256: "03877728121b498b04c64cfe425d70da0d757e8a3a563fc0ad25a6da247c123a"
  KEY_ALIAS: "shuttle"

jobs:
  check_branch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "Release APKs are only built on the main branch (this run: $GITHUB_REF)"; exit 1; fi

  build_apk:
    needs: check_branch
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}

    steps:
      # The tools preinstalled on the Ubuntu runner fill most of the disk, and a Rust + NDK + Gradle build runs
      # out of space halfway ("No space left on device"). Remove what we don't use (.NET, Haskell, CodeQL,
      # Docker images, ...) and leave the Android SDK alone.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost             /usr/share/swift /usr/local/lib/node_modules /opt/microsoft /usr/local/share/chromium /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned 2026-11-14
        with:
          fetch-depth: 0 # the build number counts commits

      - name: Compute version
        id: version
        run: bash support/scripts/shuttle_version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, pinned 2026-11-16
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, pinned 2026-11-14 (third-party)
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # Rust version from packages/localsend_isolates/rust-toolchain.toml
      - name: Rust toolchain and Android target
        working-directory: packages/localsend_isolates
        run: |
          rustup toolchain install --profile minimal
          rustup target add aarch64-linux-android
          rustup show

      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "ANDROID_KEYSTORE_BASE64 is missing from the secrets"; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "ANDROID_KEYSTORE_PASSWORD is missing from the secrets"; exit 1; fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shuttle-android.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/shuttle-android.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > app/android/key.properties

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --build-name=${{ steps.version.outputs.version }} --build-number=${{ steps.version.outputs.build }}

      - name: Check APK (signer, version, not debuggable, Rust library)
        working-directory: app
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          echo "$certs" | grep -i "certificate SHA-256 digest"
          echo "$certs" | grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" || { echo "Wrong signing certificate: this APK cannot be installed over an existing Shuttle"; exit 1; }
          badging=$("$tools/aapt2" dump badging "$apk")
          echo "$badging" | head -1
          echo "$badging" | grep -q "versionCode='${{ steps.version.outputs.build }}'" || { echo "versionCode is not the build number"; exit 1; }
          if echo "$badging" | grep -q "application-debuggable"; then echo "The APK is debuggable"; exit 1; fi
          unzip -l "$apk" > "$RUNNER_TEMP/apk-list.txt"
          grep -q "lib/arm64-v8a/librust_lib_localsend_app.so" "$RUNNER_TEMP/apk-list.txt" || { echo "The APK is missing the Rust core library"; exit 1; }
          mkdir -p "$RUNNER_TEMP/apk-result"
          cp "$apk" "$RUNNER_TEMP/apk-result/Shuttle-${{ steps.version.outputs.version }}.apk"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shuttle-android.keystore" app/android/key.properties

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, pinned 2026-11-14
        with:
          name: shuttle-android-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/apk-result/Shuttle-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14
